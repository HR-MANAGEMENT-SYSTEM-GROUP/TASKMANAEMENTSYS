<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("journey-theme")==="dark"||localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masar — Company Policies</title>
  <link rel="icon" type="image/svg+xml" href="../home/MASAR.png">

  <!-- Fonts: Inter & Quicksand (Matching HR Dashboard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Sidebar & Policy CSS -->
  <link rel="stylesheet" href="../../Shared/HR-shared.css">
  <link rel="stylesheet" href="../../Shared/HR-sidebar.css">
  <link rel="stylesheet" href="hrpolicy.css">
</head>
<body>

<div class="hr-sidebar-page">
    <!-- Sidebar -->
    <div id="hrSidebar"></div>
    
    <div class="hr-with-sidebar-content">

      <!-- ================= HEADER (HR DASHBOARD HERO) ================= -->
      <header class="page-header" id="dashboardHero">
        <div class="header-inner">
          <div class="header-content">
            <span class="page-eyebrow">
              <span class="eyebrow-pulse"></span>
              HR Portal &middot; Masar Platform
            </span>
            <h1 class="page-title">
              Company <span class="accent">Policies</span>
            </h1>
            <p class="page-subtitle">
              Browse, search, and manage your organization's official workplace policies and guidelines.
            </p>
          </div>
          <div class="header-widgets">
            <div class="header-meta-pill">
              <span class="meta-status-dot"></span>
              <span>Platform Live</span>
            </div>
            <div class="header-meta-pill">
              <i class="bi bi-file-earmark-text"></i>
              <span id="policyCount">0 Policies</span>
            </div>
          </div>
        </div>
      </header>

      <!-- ================= TOOLBAR ================= -->
      <div class="toolbar">
        <div class="search-box flex-grow-1">
          <i class="bi bi-search" aria-hidden="true"></i>
          <input type="search" id="searchInput" class="form-control" placeholder="Search policies by title…" autocomplete="off">
        </div>
        <div class="toolbar-actions">
          <button type="button" class="btn-masar" onclick="openAdd()">
            <i class="bi bi-plus-lg"></i>
            <span>Add Policy</span>
          </button>
        </div>
      </div>

      <!-- ================= POLICIES GRID ================= -->
      <div class="row g-4" id="policyGrid"></div>

      <!-- Empty State -->
      <div class="empty-state d-none" id="emptyState">
        <div class="empty-icon"><i class="bi bi-folder2-open"></i></div>
        <h2>No policies found</h2>
        <p>No matching policies were found.</p>
      </div>

      <!-- Footer -->
      <footer class="page-footer">
        <div class="container text-center">Policies are safely stored in your browser's localStorage.</div>
      </footer>

    </div>
</div>

<!-- ================= POP-UP MODAL (ADD & EDIT) ================= -->
<div class="modal-overlay" id="policyModal" style="display: none;">
  <div class="modal-box">
    <div class="modal-header-custom">
      <div class="modal-title-group">
        <div class="modal-icon"><i class="bi bi-file-earmark-text"></i></div>
        <h4 id="modalTitle">Add New Policy</h4>
      </div>
      <button type="button" class="btn-close-custom" onclick="closeModal()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>

    <form id="policyForm">
      <div class="modal-body-custom">
        <div class="mb-3">
          <label class="form-label">Policy Title</label>
          <input type="text" class="form-control" id="titleInput" placeholder="e.g. Remote Work Policy" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Policy Description</label>
          <textarea class="form-control" id="descInput" rows="5" placeholder="Write full policy text here…" required></textarea>
        </div>
      </div>

      <div class="modal-footer-custom">
        <button type="button" class="btn-masar-ghost" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-masar">
          <i class="bi bi-check2-circle"></i>
          <span>Save Policy</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../Shared/HR-shared.js"></script>
<script src="hrpolicy.js"></script>

</body>
</html>
