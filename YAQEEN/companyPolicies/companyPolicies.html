<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masar — Company Policies</title>
    <link rel="icon" href="/Shared/MASAR.png">
    <script>try{const t=localStorage.getItem("journey-theme")||localStorage.getItem("theme");if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");}else{document.documentElement.removeAttribute("data-theme");}}catch(e){}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/Shared/navbar-footer.css">
    <link rel="stylesheet" href="companyPolicies.css">
</head>
<body class="company-policies">

<main class="page" id="main-content">

    <!-- Header -->
    <header class="page-header">
        <div>
            <h1>Company <span>Policies.</span></h1>
            <p class="subtitle">Everything you need to know about how we work, in one place. Search, read, and download the policies that apply to you.</p>
        </div>

        <div class="search-box">
            <i class="bi bi-search" aria-hidden="true"></i>
            <input type="search" id="Search" placeholder="Search policies..." aria-label="Search policies" autocomplete="off">
        </div>
    </header>

    <!-- Policies -->
    <section class="section" id="all-policies" aria-labelledby="policiesTitle">
        <div class="section-header">
            <div>
                <h2 id="policiesTitle"><span class="section-number">01</span> All Policies</h2>
                <p>Official guidelines shared by HR.</p>
            </div>
            <span class="section-badge"><i class="bi bi-journal-text" aria-hidden="true"></i> Policies: <span id="policiesCount">0</span></span>
        </div>

        <div class="row g-4" id="policies"></div>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="companyPolicies.js"></script>
<script src="/Shared/navbar-footer.js"></script>
</body>
</html>
