<!DOCTYPE html>
<html lang="en">
<head>
  <script>try{if(localStorage.getItem("journey-theme")==="dark"||localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masar — Employee Feedback</title>
  <link rel="icon" type="image/png" href="../../Shared/MASAR.png">

  <!-- Fonts: Inter & Quicksand (same as the Company Policies page) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../Shared/HR-shared.css">
  <link rel="stylesheet" href="feedBackHr.css">
  <link rel="stylesheet" href="../../Shared/HR-sidebar.css">
</head>
<body>
  <div class="hr-page-wrapper">

    <!-- Shared sidebar (loaded by HR-shared.js) -->
    <div id="hrSidebar"></div>

    <div class="hr-page-content">
      <main class="fb-hr">

        <!-- ================= HEADER ================= -->
        <header class="page-header">
          <div class="header-inner">
            <div class="header-content">
              <span class="page-eyebrow">
                <span class="eyebrow-pulse"></span>
                HR Portal &middot; Masar Platform
              </span>
              <h1 class="page-title">
                Employee <span class="accent">Feedback</span>
              </h1>
              <p class="page-subtitle">
                Feedback submitted by employees
              </p>
            </div>
            <div class="header-widgets">
              <div class="header-meta-pill">
                <span class="meta-status-dot"></span>
                <span>Platform Live</span>
              </div>
              <div class="header-meta-pill">
                <i class="bi bi-chat-dots"></i>
                <!-- #count is filled by feedBackHr.js -->
                <span><span id="count">0</span> Submissions</span>
              </div>
            </div>
          </div>
        </header>

        <section aria-labelledby="boardTitle">

          <!-- ================= TOOLBAR ================= -->
          <div class="toolbar">
            <span class="toolbar-icon" aria-hidden="true"><i class="bi bi-inbox-fill"></i></span>
            <h2 class="toolbar-title" id="boardTitle">
            <select id="categorySelect" >
              <option value="all">All submissions</option>
              <option value="suggestion">Suggestion</option>
              <option value="Complaint">Complaint</option>
              <option value="Praise">Praise</option>
              <option value="Other">Other</option>
            </select>
            </h2>
          </div>

          <!-- ================= FEEDBACK GRID ================= -->
          <!-- Filled by feedBackHr.js (keep it empty so :empty can show the empty state) -->
          <div class="row g-4" id="parent"></div>

          <!-- Empty State -->
          <div class="empty-state">
            <div class="empty-icon" aria-hidden="true"><i class="bi bi-chat-square-text"></i></div>
            <h3>No feedback yet</h3>
            <p>New submissions from employees will show up here.</p>
          </div>

        </section>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="feedBackHr.js"></script>
  <script src="../../Shared/HR-shared.js"></script>
</body>
</html>
