<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masar — Leave Requests</title>
    <link rel="icon" type="image/svg+xml" href="../../NADA/home/MASAR.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../Shared/HR-shared.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hr-page-wrapper">

        <div id="hrSidebar"></div>

        <main class="hr-page-content">

            <div class="container-fluid px-4 pb-5">

                <header class="page-header" id="leavesHero">
                    <div class="header-inner">
                        <div class="header-content">
                            <span class="page-eyebrow">
                                <span class="eyebrow-pulse"></span>
                                HR Portal &middot; Masar Platform
                            </span>
                            <h1 class="page-title">
                                Leave <span class="accent">Requests</span>
                            </h1>
                            <p class="page-subtitle">
                                Review, filter, and respond to employee leave and absence requests in real time.
                            </p>
                        </div>

                        <div class="header-widgets">
                            <div class="header-meta-pill">
                                <span class="meta-status-dot"></span>
                                <span>Platform Live</span>
                            </div>
                            <div class="header-meta-pill">
                                <i class="bi bi-shield-check"></i>
                                <span>HR Approvals</span>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- ================= SEARCH & STATUS TOOLBAR ================= -->
                <section class="toolbar-section">
                    <div class="toolbar-card">
                        <div class="search-box">
                            <i class="bi bi-search"></i>
                            <input 
                                type="text" 
                                id="searchEmployee" 
                                class="form-control" 
                                placeholder="Filter by employee name..." 
                                autocomplete="off"
                            >
                        </div>

                        <div class="status-box">
                            <div class="select-wrapper">
                                <i class="bi bi-funnel-fill select-icon"></i>
                                <select id="statusFilter" class="form-select">
                                    <option value="All">All Statuses</option>
                                    <option value="Pending">Pending</option>
                                    <option value="Approved">Approved</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- ================= LEAVE REQUESTS TABLE CARD ================= -->
                <section class="card-section">
                    <div class="card-header-bar">
                        <div class="card-title-group">
                            <div class="card-title-icon">
                                <i class="bi bi-calendar2-check-fill"></i>
                            </div>
                            <div>
                                <h2 class="card-title-text">Employee Leave Applications</h2>
                                <p class="card-subtitle-text">Official submissions requiring HR review and decision</p>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive table-wrapper">
                        <table class="table align-middle">
                            <thead>
                                <tr>
                                    <th>Employee</th>
                                    <th>Type</th>
                                    <th>Dates / Time</th>
                                    <th>Reason</th>
                                    <th>Attachment</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="hrRequestsTable">
                                <!-- Populated dynamically by java-hr.js -->
                            </tbody>
                        </table>
                    </div>
                </section>

            </div>

            <!-- ================= SHARED FOOTER ================= -->
            <div id="hrFooter"></div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../Shared/HR-shared.js"></script>
    <script src="java-hr.js"></script>

</body>

</html>
