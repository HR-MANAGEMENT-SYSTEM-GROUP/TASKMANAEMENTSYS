<!DOCTYPE html>
<html lang="en">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HR Leave Management Portal</title>

    <!-- Your Page CSS -->
    <link rel="stylesheet" href="./style.css">
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Shared HR CSS -->
    <link rel="stylesheet" href="../Shared/HR-shared.css">
</head>
</head>
<body>
   
    <body>

    <div class="hr-page-wrapper">

        <!-- Shared HR Sidebar -->
        <div id="hrSidebar"></div>

        <!-- Main Content -->
        <main class="hr-page-content">

            <div class="container my-4">
        <div style="margin-bottom: 1.5rem;">
            <h2>Leave Requests</h2>
            <p class="text-secondary" style="margin-bottom: 0;">Review and respond to employee leave requests</p>
        </div>

        <div class="row my-3 g-2">
            <div class="col-md-6">
                <input type="text" id="searchEmployee" class="form-control" placeholder="Filter by employee name...">
            </div>
            <div class="col-md-6">
                <select id="statusFilter" class="form-select">
                    <option value="All">All Statuses</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                </select>
            </div>
        </div>

        <div class="tableReq mt-4">
            <table class="table table-dark table-hover align-middle">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Type</th>
                        <th>Dates / Time</th>
                        <th>Reason</th>
                        <th>Attachment</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="hrRequestsTable">
                
                </tbody>
            </table>
        </div>
    </div>
    <script src="../Shared/HR-shared.js"></script>

    <script src="java-hr.js"></script>
</body>
</html>
